<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:;">
  <title>OmniEng Detached Panel</title>
  <link rel="stylesheet" href="../styles/glassmorphic_theme.css">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/docking.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0e1217;
      color: #e1e4e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #panel-header {
      height: 36px;
      background: rgba(24, 30, 40, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
    }
    #panel-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #58a6ff;
    }
    #panel-content-host {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    .panel-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .panel-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="panel-header">
    <div id="panel-title">OmniEng Detached Panel</div>
    <div>
      <button class="panel-btn" id="btn-dock-back" title="Re-dock to Main Window">Dock Back</button>
    </div>
  </div>
  <div id="panel-content-host">
    <!-- Panel content injected or rendered here via MessagePort / IPC -->
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const panelId = urlParams.get('panelId') || 'Unknown Panel';
    document.getElementById('panel-title').textContent = panelId.replace('modal-', '').replace(/-/g, ' ').toUpperCase();
    document.title = `OmniEng - ${document.getElementById('panel-title').textContent}`;

    document.getElementById('btn-dock-back').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
